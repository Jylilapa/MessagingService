<div class="d-flex flex-column flex-md-row align-items-center p-3 px-md-4 mb-3 bg-white border-bottom box-shadow">
        <h5 class="my-0 mr-md-auto font-weight-normal">Совушка</h5>
        <nav class="ms-5">
            <a class="p-2 btn btn-outline-primary" href="/">Главная</a>
            {% if user.is_authenticated %}
            <a class="p-2 btn btn-outline-primary" href="{% url 'recipients:letter_list' %}">Все сообщения</a>
            <a class="p-2 btn btn-outline-primary" href="{% url 'mailings:mailing_list' %}" role="button">
            Список всех рассылок
            </a>
            <a class="p-2 btn btn-outline-primary" href="{% url 'mailings:mailing_create' %}">Создать рассылку</a>
            <a class="p-2 btn btn-outline-primary" href="{% url 'mailings:attempt_list' %}">Попытки рассылок</a>
            {% endif %}
            {% if user.is_authenticated %}
            <a class="p-2 btn btn-outline-primary" href="{% url 'users:logout' %}">Выход</a>
            {% else %}
            <a class="p-2 btn btn-outline-primary" href="{% url 'users:login' %}">Вход</a>
            <a class="p-2 btn btn-outline-primary" href="{% url 'users:register' %}">Регистрация</a>
            {% endif %}
        </nav>
</div>
