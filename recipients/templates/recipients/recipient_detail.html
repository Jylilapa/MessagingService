{% extends "recipients/base.html" %}
{% block content %}
    <div class="row mt-5 mx-auto p-2">
        <div class="col-1"></div>
            <div class="row row-cols-1 row-cols-md-2 g-4">
                  <div class="col">
                        <div class="card">
                            <div class="card-body">
                                <h5 class="card-title">Получатель рассылки</h5>
                                <p class="card-text">Адрес электронной почты: {{ recipient.email }}</p>
                                <p class="card-text">Имя: {{ recipient.first_name }}</p>
                                <p class="card-text">Фамилия: {{ recipient.last_name }}</p>
                                <p class="card-text">Комментарии: {{ recipient.comments  }} </p>
                                <a class="btn btn-primary" href="{% url 'recipients:recipient_update' recipient.pk %}" role="button">Редактировать</a>
                                <a class="btn btn-primary" href="{% url 'recipients:recipient_delete' recipient.pk %}" role="button">Удалить</a>
                            </div>
                        </div>
                  </div>
            </div>
        <div class="col-1"></div>
    </div>
{% endblock %}
