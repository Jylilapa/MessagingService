{% extends "recipients/base.html" %}
{% block content %}
    <div class="row mt-5 mx-auto p-2">
        <div class="col-1"></div>
            <div class="row row-cols-1 row-cols-md-2 g-4">
                {% for user in object_list %}
                  <div class="col">
                    <div class="card">
                        <div class="card-body">
                            <h5 class="card-title">Пользователь</h5>
                            <p class="card-text">Имя: {{ user.username }}</p>
                            <p class="card-text">Адрес электронной почты: {{ user.email }}</p>
                            <a class="btn btn-primary" href="{% url 'users:user_moderator_form' user.pk %}" role="button">Блокировать</a>
                      </div>
                    </div>
                  </div>
                {% endfor %}
            </div>
        <div class="col-1"></div>
    </div>
{% endblock %}
