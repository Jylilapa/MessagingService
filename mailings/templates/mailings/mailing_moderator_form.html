{% extends "recipients/base.html" %}
{% block content %}
{% if perms.mailings.can_stop_mailings %}
<div class="row">
    <div class="col-6">
        <form class="row" method="post" enctype="multipart/form-data">
            <div class="card">
                <div class="card-body">
                    {% csrf_token %}
                    {{ form.as_p }}
                </div>
                <button type="submit" class="btn btn-primary">
                    Заблокировать рассылку
                </button>
            </div>
        </form>
    </div>
</div>
{% endif %}
{% endblock %}
